<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Showroom</title>
<style>
:root{--gold:#d4a017;--gold2:#f5d77a;--bg:#050505;--card:#111;--line:#262626;--text:#f2f2f2;--muted:#9a9a9a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* preloader */
#pre{position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .6s,visibility .6s}
#pre.hide{opacity:0;visibility:hidden}
#pre b{font-size:26px;letter-spacing:4px;color:var(--gold);animation:pulse 1.2s infinite}
.bar{width:160px;height:3px;background:#222;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:load 1.1s forwards}
@keyframes load{to{width:100%}}
@keyframes pulse{50%{opacity:.4}}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 5%;transition:.35s}
header.s{background:rgba(5,5,5,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 5%;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;color:var(--gold);letter-spacing:1px}
nav a{margin-left:22px;color:#ddd;text-decoration:none;font-size:14px;position:relative}
nav a::after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:0;background:var(--gold);transition:.3s}
nav a:hover::after{width:100%}

/* hero */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:110px 5% 150px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:float 9s ease-in-out infinite}
.b1{width:380px;height:380px;background:var(--gold);top:-80px;left:-80px}
.b2{width:320px;height:320px;background:#8a5a00;bottom:-60px;right:-60px;animation-delay:-4s}
@keyframes float{50%{transform:translate(40px,30px) scale(1.15)}}
.hero h1{position:relative;font-size:clamp(34px,8vw,84px);font-weight:900;line-height:1.05;margin-bottom:16px}
.hero h1 span{display:inline-block;opacity:0;transform:translateY(60px) rotate(4deg);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation-name:up,shine;animation-duration:.8s,4s;animation-iteration-count:1,infinite;animation-fill-mode:forwards,none;animation-timing-function:cubic-bezier(.2,.8,.2,1),linear}
@keyframes up{to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200% 0}}
.hero p{position:relative;max-width:540px;color:#bbb;margin-bottom:28px;opacity:0;animation:up .8s .5s forwards}
.cta{position:relative;opacity:0;animation:up .8s .7s forwards;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:14px 30px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;border:0;cursor:pointer;transition:.3s}
.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;box-shadow:0 0 0 0 rgba(212,160,23,.6);animation:ring 2.2s infinite}
.gold:hover{transform:translateY(-3px) scale(1.04)}
.ghost{border:1px solid var(--gold);color:var(--gold)}
.ghost:hover{background:var(--gold);color:#000}
@keyframes ring{70%{box-shadow:0 0 0 16px rgba(212,160,23,0)}}

/* road + driving car */
.road{position:absolute;left:0;right:0;bottom:0;height:90px;border-top:2px solid #222;background:#0a0a0a}
.road::before{content:"";position:absolute;left:0;right:0;top:48px;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 40px,transparent 40px 90px);animation:road 1s linear infinite;opacity:.7}
@keyframes road{to{background-position:-90px 0}}
.drive{position:absolute;bottom:34px;left:-260px;width:220px;animation:drive 9s linear infinite}
@keyframes drive{to{left:105%}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* stats */
.stats{display:flex;justify-content:center;gap:clamp(20px,6vw,70px);flex-wrap:wrap;padding:40px 5%;border-bottom:1px solid var(--line)}
.stat{text-align:center}
.stat b{display:block;font-size:clamp(30px,5vw,48px);color:var(--gold)}
.stat span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:2px}

/* marquee */
.mq{overflow:hidden;border-bottom:1px solid var(--line);padding:16px 0;background:#0a0a0a}
.mq div{display:flex;gap:50px;width:max-content;animation:mq 22s linear infinite}
.mq span{font-size:22px;font-weight:800;color:#2e2e2e;text-transform:uppercase;letter-spacing:3px;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}

section.w{padding:70px 5%;max-width:1150px;margin:auto}
h2{font-size:clamp(26px,4vw,40px);margin-bottom:8px}
h2 em{color:var(--gold);font-style:normal}
.sub{color:var(--muted);margin-bottom:26px}

/* reveal */
.rv{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* filters + cards */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.filters button{padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;transition:.3s}
.filters button:hover{border-color:var(--gold)}
.filters button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;perspective:1000px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;opacity:0;transform:translateY(40px) scale(.96);animation:pop .7s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .15s,border-color .3s,box-shadow .3s}
@keyframes pop{to{opacity:1;transform:none}}
.card:hover{border-color:var(--gold);box-shadow:0 20px 50px rgba(212,160,23,.18)}
.card::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent);transition:.8s}
.card:hover::after{left:140%}
.pic{height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 80%,var(--cc),transparent 70%)}
.pic svg{width:72%;transition:transform .5s}
.card:hover .pic svg{transform:translateX(10px) scale(1.08)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .pic img{transform:scale(1.12)}
.badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.7);border:1px solid var(--gold);color:var(--gold);font-size:11px;padding:4px 10px;border-radius:999px;z-index:2}
.info{padding:16px 18px 20px}
.info h3{font-size:18px}
.tag{font-size:12px;color:var(--muted);margin-top:2px}
.price{color:var(--gold);font-weight:800;font-size:20px;margin:10px 0 14px}
.info a{display:block;text-align:center;padding:11px;border-radius:12px;background:#16a34a;color:#fff;text-decoration:none;font-weight:600;transition:.3s}
.info a:hover{background:#15803d;transform:translateY(-2px)}

/* contact */
.box{background:linear-gradient(145deg,#141414,#0b0b0b);border:1px solid var(--line);border-radius:22px;padding:30px;line-height:2;display:grid;gap:4px}
.box div::before{color:var(--gold);margin-right:8px}
.row{display:flex;gap:10px;align-items:center}
footer{text-align:center;padding:28px;background:#000;color:var(--gold);border-top:2px solid var(--gold);font-size:13px}

/* floating whatsapp */
.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center;z-index:9;text-decoration:none;color:#fff;font-size:26px;animation:fabp 2s infinite}
@keyframes fabp{70%{box-shadow:0 0 0 18px rgba(22,163,74,0)}0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.rv,.card{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="pre"><b id="preName"></b><div class="bar"><i></i></div></div>

<header id="hd">
  <div class="logo" id="logo"></div>
  <nav><a href="#cars">Cars</a><a href="#contact">Contact</a></nav>
</header>

<div class="hero">
  <div class="blob b1"></div><div class="blob b2"></div>
  <h1 id="title"></h1>
  <p id="tagline"></p>
  <div class="cta">
    <a class="btn gold" href="#cars">Explore Cars</a>
    <a class="btn ghost" id="wa1" target="_blank" rel="noopener">WhatsApp Us</a>
  </div>
  <div class="road"></div>
  <svg class="drive" viewBox="0 0 200 90">
    <path d="M15 62 L25 42 Q30 34 42 34 L80 34 L100 16 Q104 12 112 12 L140 12 Q150 12 156 22 L170 40 L186 46 Q192 48 192 56 L192 66 L15 66Z" fill="#d4a017"/>
    <path d="M92 34 L108 20 L138 20 L150 34Z" fill="#0b0b0b" opacity=".85"/>
    <g class="wheel"><circle cx="52" cy="68" r="14" fill="#000"/><circle cx="52" cy="68" r="7" fill="#777"/><path d="M52 61V75M45 68H59" stroke="#000" stroke-width="2"/></g>
    <g class="wheel"><circle cx="152" cy="68" r="14" fill="#000"/><circle cx="152" cy="68" r="7" fill="#777"/><path d="M152 61V75M145 68H159" stroke="#000" stroke-width="2"/></g>
  </svg>
</div>

<div class="stats" id="stats"></div>
<div class="mq"><div id="mq"></div></div>

<section class="w" id="cars">
  <h2 class="rv">Our <em>Cars</em></h2>
  <p class="sub rv">Pasand ki car chuno aur seedha WhatsApp par baat karo.</p>
  <div class="filters rv" id="filters"></div>
  <div class="grid" id="grid"></div>
</section>

<section class="w" id="contact">
  <h2 class="rv">Contact <em>Us</em></h2>
  <div class="box rv">
    <div id="addr"></div><div id="time"></div><div id="ph"></div>
    <div style="margin-top:14px"><a class="btn gold" id="wa2" target="_blank" rel="noopener">WhatsApp Us</a></div>
  </div>
</section>

<footer id="foot"></footer>
<a class="fab" id="wa3" target="_blank" rel="noopener" aria-label="WhatsApp">&#9990;</a>

<script>
/* ============ SHOWROOM WALA SIRF YEH HISSA EDIT KARE ============ */
const SHOP = {
  name: "Your Showroom Name",
  tagline: "Best prices, verified cars, easy deals.",
  phone: "923001234567",          // country code ke saath, bina + ke
  address: "Main Road, Your City",
  timing: "Mon to Sat: 10 AM - 8 PM",
  currency: "Rs",
  // Neeche ke numbers sach likhein (ya line hata dein)
  stats: [ {n:500, s:"+", l:"Happy Customers"}, {n:10, s:"+", l:"Years Experience"} ]
};
const CARS = [
  // img: "images/corolla.jpg"  (photo ho to likho, warna "" chor do)
  {n:"Toyota Corolla", t:"Sedan",     y:2022, p:"6,500,000",  c:"#3b82f6", img:""},
  {n:"Honda Civic",    t:"Sedan",     y:2021, p:"7,200,000",  c:"#94a3b8", img:""},
  {n:"Toyota Fortuner",t:"SUV",       y:2023, p:"15,500,000", c:"#d4a017", img:""},
  {n:"Kia Sportage",   t:"SUV",       y:2022, p:"9,800,000",  c:"#16a34a", img:""},
  {n:"Suzuki Swift",   t:"Hatchback", y:2022, p:"3,900,000",  c:"#f59e0b", img:""},
  {n:"Suzuki Alto",    t:"Hatchback", y:2023, p:"2,700,000",  c:"#a855f7", img:""}
];
/* ================================================================= */

const $=id=>document.getElementById(id);
document.title=SHOP.name;
$("logo").textContent=SHOP.name; $("preName").textContent=SHOP.name.toUpperCase();
$("title").innerHTML=SHOP.name.split(" ").map((w,i)=>`<span style="animation-delay:${i*.12}s,.9s">${w}</span>`).join(" ");
$("tagline").textContent=SHOP.tagline;
$("addr").textContent="Address: "+SHOP.address;
$("time").textContent="Timing: "+SHOP.timing;
$("ph").textContent="Phone: +"+SHOP.phone;
["wa1","wa2","wa3"].forEach(id=>$(id).href="https://wa.me/"+SHOP.phone);
$("foot").textContent="© "+new Date().getFullYear()+" "+SHOP.name;
window.addEventListener("load",()=>setTimeout(()=>$("pre").classList.add("hide"),900));
addEventListener("scroll",()=>$("hd").classList.toggle("s",scrollY>40));

/* stats + counters */
const st=[{n:CARS.length,s:"",l:"Cars Available"},...(SHOP.stats||[])];
$("stats").innerHTML=st.map(x=>`<div class="stat rv"><b data-n="${x.n}" data-s="${x.s}">0</b><span>${x.l}</span></div>`).join("");

/* marquee (brands from car names) */
const brands=[...new Set(CARS.map(c=>c.n.split(" ")[0]))];
const mqHtml=brands.concat(brands,brands,brands).map(b=>`<span>${b}</span>`).join("");
$("mq").innerHTML=mqHtml+mqHtml;

/* cars */
const svg=c=>`<svg viewBox="0 0 200 90"><path d="M15 62 L25 42 Q30 34 42 34 L80 34 L100 16 Q104 12 112 12 L140 12 Q150 12 156 22 L170 40 L186 46 Q192 48 192 56 L192 66 L15 66Z" fill="${c}"/><path d="M92 34 L108 20 L138 20 L150 34Z" fill="#0b0b0b" opacity=".8"/><circle cx="52" cy="68" r="14" fill="#000"/><circle cx="52" cy="68" r="6" fill="#888"/><circle cx="152" cy="68" r="14" fill="#000"/><circle cx="152" cy="68" r="6" fill="#888"/></svg>`;
const types=["All",...new Set(CARS.map(x=>x.t))];
$("filters").innerHTML=types.map((t,i)=>`<button class="${i?"":"on"}" data-t="${t}">${t}</button>`).join("");
function draw(t){
  $("grid").innerHTML=CARS.filter(x=>t==="All"||x.t===t).map((x,i)=>{
    const msg=encodeURIComponent("Hello, I am interested in "+x.n+" ("+x.y+")");
    return `<div class="card" style="animation-delay:${i*.08}s;--cc:${x.c}33"><span class="badge">${x.t}</span>
    <div class="pic">${x.img?`<img src="${x.img}" alt="${x.n}">`:svg(x.c)}</div>
    <div class="info"><h3>${x.n}</h3><div class="tag">Model ${x.y}</div>
    <div class="price">${SHOP.currency} ${x.p}</div>
    <a href="https://wa.me/${SHOP.phone}?text=${msg}" target="_blank" rel="noopener">Inquire on WhatsApp</a></div></div>`;
  }).join("");
  tilt();
}
$("filters").onclick=e=>{
  if(e.target.tagName!=="BUTTON")return;
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("on"));
  e.target.classList.add("on");draw(e.target.dataset.t);
};

/* 3D tilt on cards (desktop) */
function tilt(){
  document.querySelectorAll(".card").forEach(c=>{
    c.onmousemove=e=>{const r=c.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      c.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-6px)`};
    c.onmouseleave=()=>c.style.transform="";
  });
}
draw("All");

/* scroll reveal + counters */
function count(el){
  const n=+el.dataset.n,s=el.dataset.s;let v=0;const step=Math.max(1,Math.ceil(n/50));
  const t=setInterval(()=>{v+=step;if(v>=n){v=n;clearInterval(t)}el.textContent=v+s},30);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");
    const b=e.target.querySelector("b[data-n]");if(b)count(b);io.unobserve(e.target)}
}),{threshold:.15});
document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
</body>
</html>
